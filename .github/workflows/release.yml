name: Test and release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm run build
      - run: npx playwright install --with-deps msedge
      - name: Start editor
        run: |
          node server.mjs > /tmp/editor.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/editor.log
          exit 1
      - run: npm run test:browser
      - run: npm run test:layout
      - run: npm run test:resolution
      - run: npm run test:alignment
      - run: npm run test:jxl

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Check version and prepare notes
        id: version
        run: npm run check:release
      - run: npm run build
      - name: Package static site
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          cd dist
          zip -qr "../onions-img-editor-${RELEASE_TAG}.zip" .
          cd ..
          sha256sum "onions-img-editor-${RELEASE_TAG}.zip" > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file .release/notes.md \
              "onions-img-editor-${RELEASE_TAG}.zip" SHA256SUMS
          fi
